name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Go env
        run: |
          go version
          go env

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Verify formatting and imports
        run: |
          make fmtcheck
          make importscheck

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: go test ./... -race -v

